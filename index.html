<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Providence Écran de chargement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Plein écran : ville de nuit en fond (canvas), logo + chargement en bas à gauche,
   règles de la ville à droite, barre d'infos en haut, musique en bas à droite. */
:root {
  --bg: #0b0b0c;
  --panel: rgba(14, 15, 18, 0.82);
  --line: #3a3a3f;
  --text: #f2f2f2;
  --text2: #c9c9ce;
  --muted: #8a8a90;
  --chrome-top: #f4f4f6;
  --chrome-bot: #b2b2b8;
  --accent: #8ecfff;          /* bleu Providence (modifiable plus bas, dans CONFIG) */
  --accent-soft: rgba(142, 207, 255, 0.16);
  --f-display: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif;
  --f-mono: "Share Tech Mono", Consolas, "Courier New", monospace;
  --cut: 14px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--f-body); font-size: 16px; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#city { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; background: linear-gradient(180deg, #07080a 0%, #10131a 62%, #0b0c0f 100%); }
#city .glow { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(ellipse 55% 45% at 62% 78%, var(--accent-soft), transparent 70%); }
#city .lay { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; transform: translate3d(0,0,0);
  animation: pan linear infinite; backface-visibility: hidden; }
#city .lay canvas { display: block; height: 100%; }
#city .fog { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(20,24,32,0) 55%, rgba(20,24,32,.55) 100%); }
#city .rain { position: absolute; left: -10%; top: -100%; width: 120%; height: 200%; background-repeat: repeat; opacity: .7;
  will-change: transform; animation: fall 1.6s linear infinite; }
@keyframes pan { to { transform: translate3d(-50%,0,0); } }
@keyframes fall { to { transform: translate3d(-60px, 50%, 0); } }
#bgimg { position: fixed; top: -3%; right: -3%; bottom: -3%; left: -3%; background-size: cover; background-position: center; opacity: 0;
  transition: opacity 1.2s ease; animation: drift 60s ease-in-out infinite alternate; }
#bgimg.on { opacity: 1; }
@keyframes drift { from { transform: scale(1.04) translateX(-1%); } to { transform: scale(1.1) translateX(1%); } }
.vignette { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(8,8,10,.88) 0%, rgba(8,8,10,.4) 36%, rgba(8,8,10,0) 58%, rgba(8,8,10,.55) 100%),
    linear-gradient(0deg, rgba(8,8,10,.95) 0%, rgba(8,8,10,0) 45%),
    radial-gradient(ellipse at 50% 120%, var(--accent-soft), transparent 60%);
}
.grain { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; opacity: .05;
  background-image: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 3px); }

.ui { position: fixed; top: 0; right: 0; bottom: 0; left: 0; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
  grid-template-rows: auto 1fr auto; grid-gap: 28px 48px;
  padding: 44px 64px 40px 64px; }
/* le coin en bas à droite reste libre : Garry's Mod y affiche sa propre barre */

/* Barre du haut */
.top { grid-column: 1; grid-row: 1; align-self: center; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px;
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--muted); }
.top b { color: var(--text2); font-weight: 700; }
.top .live { display: inline-flex; align-items: center; gap: 8px; color: var(--text2); }
.top .live::before { content: ""; width: 8px; height: 8px; background: var(--accent); box-shadow: 0 0 10px var(--accent);
  animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.top .sep { flex: 1; }

/* Bloc principal */
.hero { grid-column: 1; grid-row: 2; align-self: center; display: grid; grid-gap: 18px; max-width: 760px; min-width: 0; }
.logo { width: 640px; max-width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
.welcome { font-family: var(--f-display); font-weight: 800; font-size: 42px;
  text-transform: uppercase; letter-spacing: .08em; line-height: 1; margin: 0; padding-left: 4px;
  background: linear-gradient(180deg, var(--chrome-top), var(--chrome-bot)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.welcome span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
.tagline { margin: 0; padding-left: 6px; font-size: 19px; color: var(--text2); letter-spacing: .02em; max-width: 520px; line-height: 1.45; }
.load-wrap { grid-column: 1; grid-row: 3; min-width: 0; }

.cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.load { background: var(--panel); padding: 18px 22px 20px; position: relative; display: grid; gap: 12px;
  border-left: 3px solid var(--accent); }
.load-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.label { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .22em; font-size: 13px; color: var(--muted); }
.status { font-family: var(--f-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .06em; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pct { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .9; font-variant-numeric: tabular-nums; color: var(--text); }
.pct small { font-size: 18px; color: var(--muted); }
.bar { height: 8px; background: #1c1d22; position: relative; overflow: hidden;
  clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0%; background: linear-gradient(90deg, var(--accent), #ffffff);
  box-shadow: 0 0 16px var(--accent); transition: width .5s ease; }
.bar i::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 8px, transparent 8px 18px);
  animation: slide 1.2s linear infinite; }
@keyframes slide { to { background-position: 40px 0; } }
.file { font-family: var(--f-mono); font-size: 13px; color: var(--muted); display: flex; gap: 14px; justify-content: space-between; min-width: 0; }
.file span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file span:last-child { flex: none; font-variant-numeric: tabular-nums; }

/* Colonne de droite */
.side { grid-column: 2; grid-row: 2; align-self: center; min-width: 0; }
.music-wrap { grid-column: 2; grid-row: 1; min-width: 0; }
.rules { background: var(--panel); padding: 22px 24px 24px; display: grid; grid-gap: 18px; }
#rules { display: grid; grid-gap: 20px; }
.rules h2 { margin: 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; }
.rule { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; animation: rin .6s ease both; }
@keyframes rin { from { opacity: .0; transform: translateY(6px); } }
.rule kbd { font-family: var(--f-display); font-weight: 800; font-size: 14px; color: var(--bg); background: linear-gradient(180deg, var(--chrome-top), var(--chrome-bot));
  height: 30px; display: grid; place-items: center; clip-path: polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px); }
.rule strong { display: block; font-family: var(--f-display); font-size: 18px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
.rule p { margin: 2px 0 0; color: var(--text2); font-size: 15px; line-height: 1.4; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }

.music { background: var(--panel); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; grid-gap: 10px 14px; align-items: center; }
.music button { all: unset; cursor: pointer; width: 38px; height: 38px; display: grid; place-items: center; background: var(--accent); color: #0b0b0c;
  clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
.music button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.music button svg { width: 16px; height: 16px; fill: currentColor; }
.track { min-width: 0; }
.track b { display: block; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.eq i { width: 3px; background: var(--accent); height: 30%; }
.playing .eq i { animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s !important; } .eq i:nth-child(3) { animation-delay: -.6s !important; } .eq i:nth-child(4) { animation-delay: -.15s !important; }
@keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
#vol { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }

/* Sélecteur de bleu : visible seulement dans l'aperçu, pas en jeu */
.preview { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: var(--panel); padding: 8px 10px;
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--muted); z-index: 5; flex-wrap: wrap; }
.preview button { all: unset; cursor: pointer; padding: 5px 9px; border: 1px solid var(--line); color: var(--text2); display: inline-flex; gap: 6px; align-items: center; }
.preview button i { width: 10px; height: 10px; }
.preview button[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
.preview button:focus-visible { outline: 2px solid var(--accent); }

@media (max-width: 860px) {
  body { overflow: auto; }
  .ui { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; height: auto; min-height: 100%; }
  .preview { bottom: 8px; width: calc(100% - 32px); box-sizing: border-box; justify-content: center; }
  .ui { position: relative; padding: 24px 16px 120px; }
  .hero, .side, .load-wrap, .music-wrap, .top { grid-column: 1; grid-row: auto; }
  .logo { width: 100%; } .welcome { font-size: 28px; }
  .top .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div id="bgimg" aria-hidden="true"></div>
<div class="vignette"></div>
<div class="grain"></div>

    <span class="live" id="srv">[FR] Providence RP | DarkRP</span>

      <button id="play" aria-label="Lancer la musique"><svg viewBox="0 0 16 16"><path id="ico" d="M4 2l10 6-10 6z"/></svg></button>
      <div class="track"><b id="tname">Musique</b><span id="tsub">Clique pour lancer</span></div>
      <div class="eq"><i></i><i></i><i></i><i></i></div>

function rnd(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function buildLayer(seed, base, hMin, hMax, wMin, wMax, col, winA) {
  // une bande de largeur W, dessinée deux fois côte à côte pour boucler sans raccord
  var c = document.createElement("canvas"); c.width = W * 2; c.height = H;
  var g = c.getContext("2d"), r = rnd(seed), x = 0, blds = [];
  while (x < W) { var bw = wMin + r() * (wMax - wMin); if (x + bw > W) bw = W - x; blds.push([x, bw, H * (hMin + r() * (hMax - hMin)), r(), r()]); x += bw + r() * 6; }
  for (var rep = 0; rep < 2; rep++) {
    var wr = rnd(seed + 99);
    blds.forEach(function (bd) {
      var bx = bd[0] + rep * W, bw = bd[1], bh = bd[2], y = H * base - bh;
      g.fillStyle = col; g.fillRect(bx, y, bw, H - y);
      if (bd[3] > .7) g.fillRect(bx + bw * .4, y - bh * .08, bw * .2, bh * .08);
      if (bd[4] > .85) g.fillRect(bx + bw * .5, y - bh * .25, 2, bh * .25);
      for (var wy = y + 8; wy < H * base - 6; wy += 9) for (var wx = bx + 5; wx < bx + bw - 6; wx += 7) {
        var k = wr();
        if (k < winA) { g.fillStyle = k < winA * .18 ? "rgba(" + accentRGB.join(",") + ",.55)" : "rgba(255,214,150," + (.18 + wr() * .4) + ")"; g.fillRect(wx, wy, 3, 4); g.fillStyle = col; }
      }
    });
  }
  return c;
}
function rainTexture() {
  var c = document.createElement("canvas"); c.width = 256; c.height = 256;
  var g = c.getContext("2d"), r = rnd(5); g.strokeStyle = "rgba(180,200,230,.18)"; g.lineWidth = 1; g.beginPath();
  for (var i = 0; i < 26; i++) { var x = r() * 256, y = r() * 256, l = 10 + r() * 18; g.moveTo(x, y); g.lineTo(x - l * .18, y + l); }
  g.stroke(); return c.toDataURL();
}
function buildCity() {
  W = innerWidth; H = innerHeight;
  var city = $("city"); city.innerHTML = '<div class="glow"></div>';
  var defs = [[7, .78, .18, .45, 30, 90, "#14161c", .10, 220], [13, .86, .22, .6, 50, 130, "#0e0f13", .16, 120], [29, 1.0, .12, .42, 70, 170, "#08090b", .22, 70]];
  defs.forEach(function (d, i) {
    var lay = document.createElement("div"); lay.className = "lay";
    lay.appendChild(buildLayer(d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7]));
    lay.style.animationDuration = d[8] + "s";
    city.appendChild(lay);
    if (i === 0) { var fog = document.createElement("div"); fog.className = "fog"; city.appendChild(fog); }
  });
  var rain = document.createElement("div"); rain.className = "rain"; rain.style.backgroundImage = "url(" + rainTexture() + ")";
  city.appendChild(rain);
}
buildCity();
var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(buildCity, 300); });
function resize() { buildCity(); }
function frame() {}

/* ---------- Règles qui défilent ---------- */
var RULES = [
  ["RP", "Rien que du roleplay", "Pas de chat hors-RP : /ooc et // sont désactivés. Tout ce que tu dis, ton personnage le dit."],
  ["ID", "Une seule identité", "Ton nom, ton âge et ta taille te suivent partout. Choisis-les comme une vraie personne."],
  ["F4", "Trouver un métier", "Policier, médecin, armurier… ou la rue. Change de métier avec F4."],
  ["TAB", "Qui est en ville", "TAB affiche les habitants et leur métier. Les pseudos Steam restent cachés."],
  ["/R", "Besoin du staff", "Tape /report pour ouvrir un ticket. Un membre du staff te répond en jeu."],
  ["LOI", "Respecte la ville", "Pas de meurtre gratuit, pas de conduite suicidaire. Joue la peur, joue la douleur."]
];
var ri = 0, PER = 3, pages = Math.ceil(RULES.length / PER);
for (var d = 0; d < pages; d++) $("dots").appendChild(document.createElement("i"));
function showRule() {
  var html = "";
  for (var k = ri * PER; k < Math.min(RULES.length, ri * PER + PER); k++) {
    var r = RULES[k];
    html += '<div class="rule" style="animation-delay:' + ((k % PER) * 0.12) + 's"><kbd>' + r[0] + '</kbd><div><strong>' + r[1] + '</strong><p>' + r[2] + '</p></div></div>';
  }
  $("rules").innerHTML = html;
  [].forEach.call($("dots").children, function (d, k) { d.className = k === ri ? "on" : ""; });
  ri = (ri + 1) % pages;
}
showRule(); setInterval(showRule, 9000);

/* ---------- Horloge ---------- */
function clock() { var d = new Date(); $("clock").textContent = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + " · heure de Providence"; }
clock(); setInterval(clock, 15000);

/* ---------- Progression (fonctions appelées par Garry's Mod) ---------- */
var total = 0, needed = 0, stage = 0, inGame = false;
var STATUS_FR = [
  [/retrieving server info/i, "Récupération des infos serveur", 4],
  [/workshop/i, "Téléchargement du Workshop", 10],
  [/mounting/i, "Montage des addons", 20],
  [/downloading/i, "Téléchargement des fichiers", 25],
  [/sending client info/i, "Envoi de tes infos", 80],
  [/lua/i, "Démarrage des scripts", 88],
  [/client info/i, "Préparation du personnage", 92],
  [/map|world|loading/i, "Chargement de la ville", 95]
];
function percent() {
  var p = total > 0 ? Math.round(((total - needed) / total) * 100) : 0;
  return Math.max(stage, Math.min(p, 99));
}
function render() { var p = percent(); $("pct").textContent = p; $("fill").style.width = p + "%"; $("count").textContent = total > 0 ? (total - needed) + " / " + total : ""; }

var G = {};
G.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume) {
  if (servername) $("srv").textContent = servername;
  $("map").textContent = mapname || "—";
  $("slots").textContent = maxplayers || "—";
  if (typeof volume === "number" && volume > 0) { CONFIG.musicVolume = Math.max(0, Math.min(1, volume)); $("vol").value = Math.round(CONFIG.musicVolume * 100); applyVol(); }
  startMusic();
};
G.SetFilesTotal = function (n) { total = n; render(); };
G.SetFilesNeeded = function (n) { needed = n; render(); };
G.DownloadingFile = function (f) { $("file").textContent = f; $("status").textContent = "Téléchargement des fichiers"; };
G.SetStatusChanged = function (s) {
  var label = s;
  for (var i = 0; i < STATUS_FR.length; i++) if (STATUS_FR[i][0].test(s)) { label = STATUS_FR[i][1]; stage = Math.max(stage, STATUS_FR[i][2]); break; }
  $("status").textContent = label; render();
};
// Les appels venant du jeu passent par window.* : ils coupent la démo de l'aperçu
var simTimer = null;
["GameDetails", "SetFilesTotal", "SetFilesNeeded", "DownloadingFile", "SetStatusChanged"].forEach(function (name) {
  window[name] = function () {
    if (!inGame) { inGame = true; clearTimeout(simTimer); $("preview").hidden = true; total = needed = stage = 0; render(); $("file").textContent = ""; }
    G[name].apply(null, arguments);
  };
});

/* ---------- Musique ---------- */
var audio = null, ti = 0, ctx = null, master = null, synthOn = false, playing = false;
function applyVol() {
  var v = $("vol").value / 100;
  if (audio) audio.volume = v;
  if (master) master.gain.setTargetAtTime(v * .22, ctx.currentTime, .2);
}
function setPlaying(p) {
  playing = p; $("music").classList.toggle("playing", p);
  $("ico").setAttribute("d", p ? "M4 2h3v12H4zM9 2h3v12H9z" : "M4 2l10 6-10 6z");
  $("play").setAttribute("aria-label", p ? "Couper la musique" : "Lancer la musique");
  $("tsub").textContent = p ? (CONFIG.music.length ? "Piste " + (ti + 1) + " / " + CONFIG.music.length : "Ambiance générée") : "Clique pour lancer";
}
function loadTrack() {
  var tr = CONFIG.music[ti]; audio.src = tr.src; $("tname").textContent = tr.title || tr.src;
}
function startSynth() {
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  if (!ctx) {
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = .4;
    var lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = .05; lfoG.gain.value = 300; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    lp.connect(master); master.connect(ctx.destination);
    var chords = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], oscs = [];
    for (var v = 0; v < 6; v++) { var o = ctx.createOscillator(); o.type = v % 2 ? "sawtooth" : "triangle"; o.detune.value = (v % 2 ? 7 : -7); var g = ctx.createGain(); g.gain.value = .12; o.connect(g); g.connect(lp); o.start(); oscs.push(o); }
    var ci = 0;
    var step = function () { var ch = chords[ci % chords.length]; for (var k = 0; k < oscs.length; k++) { var n = ch[k % 3] - (k < 3 ? 12 : 0); oscs[k].frequency.setTargetAtTime(440 * Math.pow(2, (n - 69) / 12), ctx.currentTime, 1.4); } ci++; };
    step(); setInterval(step, 8000);
  }
  ctx.resume(); synthOn = true; $("tname").textContent = "Nuit sur Providence"; applyVol();
  return ctx.state === "running";
}
function startMusic() {
  if (CONFIG.music.length) {
    if (!audio) { audio = new Audio(); audio.addEventListener("ended", function () { ti = (ti + 1) % CONFIG.music.length; loadTrack(); audio.play(); }); loadTrack(); }
    applyVol();
    var p = audio.play(); if (p && p.then) p.then(function () { setPlaying(true); }, function () { setPlaying(false); }); else setPlaying(true);
  } else {
    var ok = startSynth(); setPlaying(ok);
    if (ctx && !ok) ctx.onstatechange = function () { setPlaying(ctx.state === "running"); };
  }
}
function stopMusic() {
  if (audio) audio.pause();
  if (ctx) ctx.suspend();
  setPlaying(false);
}
$("play").addEventListener("click", function () { playing ? stopMusic() : startMusic(); });
$("vol").addEventListener("input", applyVol);
if (CONFIG.music.length) $("tname").textContent = CONFIG.music[0].title || CONFIG.music[0].src;
else $("tname").textContent = "Nuit sur Providence";

/* ---------- Aperçu hors jeu : simulation (s'arrête dès que le jeu parle) ---------- */
simTimer = setTimeout(function () {
  if (inGame) return;
  $("preview").hidden = false;
  [].forEach.call(document.querySelectorAll("#preview button"), function (b) {
    b.addEventListener("click", function () {
      [].forEach.call(document.querySelectorAll("#preview button"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      setAccent(b.getAttribute("data-c")); buildCity();
    });
  });
  G.GameDetails("[FR] Providence RP | DarkRP", "", "rp_southside", 10, "", "darkrp");
  var files = ["materials/providence/logo_p.png", "materials/providence/logo_full.png", "models/humans/group01/male_07.mdl", "sound/ambient/city_rain.wav", "maps/rp_southside.bsp", "materials/scb/emoji_sheet.png", "resource/fonts/roboto.ttf"];
  var seq = [
    function () { G.SetStatusChanged("Retrieving server info"); },
    function () { G.SetStatusChanged("Mounting Addons"); },
    function () { G.SetFilesTotal(42); G.SetFilesNeeded(42); }
  ];
  for (var k = 0; k < 42; k++) (function (k) { seq.push(function () { G.DownloadingFile(files[k % files.length]); G.SetFilesNeeded(41 - k); }); })(k);
  seq.push(function () { G.SetStatusChanged("Sending client info"); });
  seq.push(function () { G.SetStatusChanged("Starting Lua..."); });
  seq.push(function () { G.SetStatusChanged("Loading map"); $("pct").textContent = 100; $("fill").style.width = "100%"; $("file").textContent = "Bienvenue en ville."; });
  var s = 0;
  (function run() {
    if (inGame) return;
    if (s < seq.length) { seq[s++](); simTimer = setTimeout(run, s < 4 ? 900 : 180); }
    else simTimer = setTimeout(function () { total = needed = stage = 0; s = 0; render(); run(); }, 4000);
  })();
}, 2500);
</script>
